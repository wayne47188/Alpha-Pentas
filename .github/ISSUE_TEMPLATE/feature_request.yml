name: Feature request
description: Suggest a scoped improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Authorization, privacy and security impact
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Acceptance criteria / tests
