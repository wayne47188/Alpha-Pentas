name: Quality or regression
description: Report test failures, technical debt, performance regressions or incorrect behavior
title: "quality: "
labels: ["quality"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observable problem
      description: Include precise file/function references and sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction and test command
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact, regression risk and rollback
