name: Bug report
description: Report a reproducible defect (never post vulnerabilities here).
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md and disclose privately."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and environment
      description: Redact tokens, private keys, customer data and IP addresses.
