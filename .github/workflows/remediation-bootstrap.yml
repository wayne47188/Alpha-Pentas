name: Remediation bootstrap (temporary)

on:
  push:
    branches: [fix/audit-remediation-001]
    paths:
      - '.github/workflows/remediation-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-001
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize committed Go code and lock UI dependencies
        run: |
          gofmt -w manager agent cli
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix console
          go test ./...
          npm ci --ignore-scripts --no-audit --no-fund --prefix console
          npm run build --prefix console
      - name: Commit exclusively formatted sources and frontend lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager agent cli console/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize Go formatting and lock console dependencies"
            git push origin HEAD:fix/audit-remediation-001
          fi
