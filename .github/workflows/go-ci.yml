name: Go CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l manager agent cli | tee /tmp/gofmt.out
      - run: test ! -s /tmp/gofmt.out
      - run: go test ./...
      - run: go vet ./...
