name: Go CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format for baseline validation
        run: gofmt -w manager/cmd/manager/main.go manager/cmd/manager/main_test.go agent/cmd/agent/main.go cli/cmd/alpha/main.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
