name: Remediation dependencies (temporary)
on:
  push:
    branches: [fix/audit-remediation-001]
    paths: ['.github/workflows/remediation-deps.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-001
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          go get github.com/lib/pq@v1.10.9
          go mod tidy
          gofmt -w manager agent cli
          go test ./...
          go vet ./...
      - name: Commit module lock and source formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum manager agent cli
          if ! git diff --cached --quiet; then
            git commit -m "build: pin PostgreSQL driver and normalize integration tests"
            git push origin HEAD:fix/audit-remediation-001
          fi
