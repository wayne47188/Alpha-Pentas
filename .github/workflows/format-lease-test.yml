name: Temporary Go format for lease test
on:
  push:
    branches: [fix/audit-remediation-001]
    paths: ['.github/workflows/format-lease-test.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-001
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          gofmt -w manager/internal/enrollment/issuance_lease_test.go
          go test ./...
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/internal/enrollment/issuance_lease_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(pki): format lease regression test"
            git push origin HEAD:fix/audit-remediation-001
          fi
