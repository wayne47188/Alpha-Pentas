name: Secure Go baseline upgrade (temporary)
on:
  push:
    branches: [fix/audit-remediation-001]
    paths: ['.github/workflows/go-secure-baseline.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/audit-remediation-001
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: true
      - name: Upgrade secure Go and gRPC baseline
        run: |
          go mod edit -go=1.27.0 -toolchain=go1.27.3
          go get google.golang.org/grpc@v1.85.0
          go mod tidy
          gofmt -w manager agent cli
          go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 ./...
      - name: Commit generated dependency state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum manager agent cli
          if ! git diff --cached --quiet; then
            git commit -m "security(build): upgrade Go 1.27.3 and gRPC 1.85.0 baseline"
            git push origin HEAD:fix/audit-remediation-001
          fi
