name: Release Integrity
on:
  pull_request:
    branches: [main, chore/github-quality-gates]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build / SBOM / provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Verify dependencies before release
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          cd console
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Build reproducible Go artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/alpha-manager-linux-amd64 ./manager/cmd/manager
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/alpha-agent-linux-amd64 ./agent/cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/alpha-agent-windows-amd64.exe ./agent/cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/alpha-cli-linux-amd64 ./cli/cmd/alpha
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/alpha-cli-windows-amd64.exe ./cli/cmd/alpha
          tar -C console -czf dist/alpha-console.tar.gz dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 manifest
        run: |
          cd dist
          sha256sum alpha-* sbom.spdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/alpha-*
            dist/sbom.spdx.json
            dist/SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha-pentas-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Ensure release build did not modify tracked files
        run: git diff --exit-code
