name: gRPC dependency bootstrap (temporary)
on:
  push:
    branches: [fix/audit-remediation-001]
    paths: ['.github/workflows/grpc-deps-bootstrap.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/audit-remediation-001
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Resolve pinned gRPC dependency
        run: |
          go get google.golang.org/grpc@v1.75.1
          go mod tidy
          gofmt -w manager/internal/transport/grpc_security.go manager/internal/transport/grpc_security_test.go
          go test -race -count=1 ./manager/internal/transport
      - name: Commit generated dependency state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum manager/internal/transport/grpc_security.go manager/internal/transport/grpc_security_test.go
          if ! git diff --cached --quiet; then
            git commit -m "build(grpc): pin transport dependencies and format security tests"
            git push origin HEAD:fix/audit-remediation-001
          fi
