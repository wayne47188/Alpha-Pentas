name: Quality Gates
on:
  pull_request:
    branches: [main, chore/github-quality-gates]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go / format, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify gofmt
        run: |
          files="$(gofmt -l manager agent cli)"
          if [ -n "$files" ]; then
            printf 'Unformatted files:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test -race -count=1 ./...
      - name: Ensure Go checks did not modify tracked files
        run: git diff --exit-code
  postgres:
    name: PostgreSQL / schema invariants and Go integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: alpha_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alpha -d alpha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alpha:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/alpha_ci?sslmode=disable
      ALPHA_TEST_DATABASE_URL: postgresql://alpha:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/alpha_ci?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run SQL transaction invariants
        run: bash tests/integration/enrollment_postgres.sh
      - name: Verify test-evidence checker behavior
        run: python3 -m unittest discover -s tools -p 'test_verify_test_results.py' -v
      - name: Run Go PostgreSQL enrollment integration (evidence required)
        run: |
          set -o pipefail
          go test -json -count=1 -timeout=90s ./manager/internal/enrollment ./manager/internal/authz ./manager/internal/operator ./manager/cmd/manager -run '^TestPostgres' | tee /tmp/go-integration.json
          postgres_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n1)"
          test -n "$postgres_container"
          ALPHA_TEST_POSTGRES_CONTAINER="$postgres_container" \
            go test -json -count=1 -timeout=90s ./manager/internal/enrollment -run '^TestDockerPostgresServerRestartDuringSigningRecovers
      - name: Ensure PostgreSQL tests did not modify tracked files
        run: git diff --exit-code
  console:
    name: Console / typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Ensure frontend checks did not modify tracked files
        run: git diff --exit-code
  security:
    name: Supply chain / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 | tee -a /tmp/go-integration.json
          python3 tools/verify_test_results.py
      - name: Ensure PostgreSQL tests did not modify tracked files
        run: git diff --exit-code
  console:
    name: Console / typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Ensure frontend checks did not modify tracked files
        run: git diff --exit-code
  security:
    name: Supply chain / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
